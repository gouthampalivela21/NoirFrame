version: '3.8'

services:
  phantom-labs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    image: phantom-labs:latest
    container_name: phantom-labs-web
    restart: unless-stopped
    ports:
      - "8080:80"
